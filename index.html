<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Surat Teguh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- Area Utama Amplop -->
        <div class="envelope-wrapper">
            
            <!-- 1. FLAP (Tutup Atas Terbuka) - Layer Paling Belakang -->
            <div class="envelope-flap open"></div>
            
            <!-- 2. LETTER (Kertas Surat) - Layer Tengah -->
            <div class="letter">
                <div class="letter-content">
                    <h1>A Letter for Teguh</h1>
                    <div class="heart-icon">♡</div>
                </div>
            </div>
            
            <!-- 3. ENVELOPE BODY (Lipatan Depan) - Layer Paling Depan -->
            <div class="envelope-body"></div>
        </div>

        <!-- Tombol OPEN -->
        <button class="open-btn">OPEN</button>
        
    </div>

</body>
</html>
