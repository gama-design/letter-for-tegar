<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Letter for Teguh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    
    <!-- Wrapper utama amplop -->
    <div class="envelope" id="envelope">
      
      <!-- 1. Flap (Tutup atas amplop) -->
      <div class="flap"></div>
      
      <!-- 2. Pocket Back (Background dalam amplop) -->
      <div class="pocket-back"></div>
      
      <!-- 3. Kertas Surat -->
      <div class="letter">
        <p class="title">A Letter for Teguh</p>
        <div class="heart">♡</div>
      </div>
      
      <!-- 4. Pocket Front (Lipatan depan amplop / Kantong) -->
      <div class="pocket-front"></div>

    </div>

    <!-- Tombol OPEN -->
    <button id="openButton" class="open-btn">OPEN</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
