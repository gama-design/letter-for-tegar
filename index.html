<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter for Tegar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cover">

        <!-- Decorative Hearts -->
        <span class="heart heart-1">♡</span>
        <span class="heart heart-2">♡</span>
        <span class="heart heart-3">♡</span>
        <span class="heart heart-4">♡</span>

        <!-- Small Introduction -->
        <p class="cover-subtitle">
            A little something for you
        </p>

        <!-- ENVELOPE -->
        <div class="envelope">

            <!-- Letter -->
            <div class="letter">

                <p class="letter-small">
                    With Love
                </p>

                <h1>
                    A Letter for Tegar
                </h1>

                <span class="letter-heart">
                    ♡
                </span>

            </div>

            <!-- Envelope Bottom Flap -->
            <div class="envelope-bottom"></div>

            <!-- Envelope Left Flap -->
            <div class="envelope-left"></div>

            <!-- Envelope Right Flap -->
            <div class="envelope-right"></div>

            <!-- Envelope Top Flap -->
            <div class="envelope-flap"></div>

        </div>

        <!-- Open Button -->
        <button class="open-button" id="openButton">
            OPEN
        </button>

        <!-- Bottom Text -->
        <p class="cover-footer">
            made with love ♡
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
