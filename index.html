<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- PENTING: Viewport meta tag agar responsif -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Letter for Tegar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Utama yang akan memenuhi seluruh layar -->
    <div class="card-container">
        
        <!-- Wrapper Utama Amplop -->
        <div class="envelope" id="envelope">
            
            <!-- 1. Background Dalam Amplop -->
            <div class="pocket-back"></div>
            
            <!-- 2. Flap / Tutup Atas Amplop -->
            <div class="flap"></div>
            
            <!-- 3. Kertas Surat (Akan naik saat diklik) -->
            <div class="letter">
                <p class="title">A Letter for Tegar</p>
                <div class="heart">♡</div>
            </div>
            
            <!-- 4. Lipatan Depan Amplop (Kantung V) -->
            <div class="pocket-front"></div>

        </div>

        <!-- Tombol OPEN -->
        <button id="openButton" class="open-btn">OPEN</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
