<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter for Tegar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="small-text">
            A little something for you
        </div>

        <!-- ENVELOPE -->
        <div class="envelope" id="envelope">

            <!-- Bagian belakang amplop -->
            <div class="envelope-back"></div>

            <!-- SURAT -->
            <div class="letter">
                <div class="letter-small">With Love</div>
                <div class="letter-title">A Letter for Tegar</div>
                <div class="letter-heart">♡</div>
            </div>

            <!-- Bagian depan amplop -->
            <div class="envelope-front"></div>

            <!-- Tutup amplop -->
            <div class="envelope-flap"></div>

        </div>


        <!-- BUTTON -->
        <button id="openButton">
            OPEN
        </button>

        <div class="footer">
            made with love ♡
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
